<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#000000">
  <title>Friend Group – Login</title>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;600;700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
  <style>
    .auth-wrap{min-height:100vh;display:grid;place-items:center;padding:24px}
    .auth-card{width:100%;max-width:400px;background:var(--card);border:1px solid var(--line);border-radius:16px;padding:32px 26px}
    .auth-card h1{margin:0 0 6px;font-size:26px;font-weight:900;letter-spacing:.08em;text-align:center}
    .auth-sub{margin:0 0 22px;text-align:center;color:var(--muted);font-size:14px}
    .tabs{display:flex;gap:6px;margin-bottom:18px}
    .tabs button{flex:1;padding:10px;border-radius:10px;border:1px solid var(--line);background:transparent;cursor:pointer;font-weight:700}
    .tabs button.active{background:#fff;color:#000}
    label{display:block;font-size:12px;color:var(--muted);margin:12px 0 6px;font-weight:600;letter-spacing:.06em;text-transform:uppercase}
    input{width:100%;padding:12px 14px;border-radius:10px;border:1px solid var(--chip-line);background:var(--chip);color:#fff;font:inherit}
    .go{width:100%;margin-top:20px;padding:13px;border-radius:10px;border:0;background:#fff;color:#000;font-weight:800;cursor:pointer}
    .go:disabled{opacity:.5}
    .msg{margin-top:14px;font-size:13px;text-align:center;min-height:18px}
    .msg.err{color:#ff6b6b}.msg.ok{color:#6bdc8b}
    .back{display:block;margin-top:18px;text-align:center;color:var(--muted);font-size:13px;text-decoration:none}
    .back:hover{color:#fff}
    #loggedin{display:none;text-align:center}
  </style>
</head>
<body>
  <div class="auth-wrap">
    <div class="auth-card">
      <h1>FRIEND GROUP</h1>
      <p class="auth-sub" id="sub">Melde dich an oder erstelle einen Account</p>

      <div id="authbox">
        <div class="tabs">
          <button type="button" id="tab-login" class="active">Login</button>
          <button type="button" id="tab-reg">Registrieren</button>
        </div>
        <label for="email">E-Mail</label>
        <input id="email" type="email" autocomplete="email" placeholder="du@beispiel.de">
        <label for="pw">Passwort</label>
        <input id="pw" type="password" autocomplete="current-password" placeholder="••••••••">
        <button class="go" id="go" type="button">Login</button>
        <div class="msg" id="msg" role="status"></div>
      </div>

      <div id="loggedin">
        <p>Eingeloggt als <strong id="who"></strong></p>
        <button class="go" id="logout" type="button">Abmelden</button>
      </div>

      <a class="back" href="index.html">← Zur Startseite</a>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
  <script>
    const SB_URL = "https://zqmbjsofhnjoueqottpy.supabase.co";
    const SB_KEY = "sb_publishable_morrdcWn-FewdKWwYJdp4A_x68YWt27";
    const sb = window.supabase.createClient(SB_URL, SB_KEY);
    let mode = "login";
    const $ = id => document.getElementById(id);
    const say = (t, c) => { $("msg").textContent = t; $("msg").className = "msg " + (c || ""); };

    function setMode(m) {
      mode = m;
      $("tab-login").classList.toggle("active", m === "login");
      $("tab-reg").classList.toggle("active", m === "reg");
      $("go").textContent = m === "login" ? "Login" : "Account erstellen";
      $("pw").autocomplete = m === "login" ? "current-password" : "new-password";
      say("");
    }
    $("tab-login").onclick = () => setMode("login");
    $("tab-reg").onclick = () => setMode("reg");

    function showState(session) {
      const on = !!session;
      $("authbox").style.display = on ? "none" : "block";
      $("loggedin").style.display = on ? "block" : "none";
      if (on) $("who").textContent = session.user.email;
    }

    $("go").onclick = async () => {
      const email = $("email").value.trim(), password = $("pw").value;
      if (!email || password.length < 6) return say("E-Mail und Passwort (mind. 6 Zeichen) eingeben.", "err");
      $("go").disabled = true;
      try {
        if (mode === "login") {
          const { error } = await sb.auth.signInWithPassword({ email, password });
          if (error) throw error;
          window.location.href = "index.html";
        } else {
          const { data, error } = await sb.auth.signUp({ email, password });
          if (error) throw error;
          if (data.session) window.location.href = "index.html";
          else say("Account erstellt! Bitte bestätige deine E-Mail und logge dich dann ein.", "ok");
        }
      } catch (e) { say(e.message || "Fehler beim Anmelden.", "err"); }
      $("go").disabled = false;
    };
    $("pw").addEventListener("keydown", e => { if (e.key === "Enter") $("go").click(); });
    $("logout").onclick = async () => { await sb.auth.signOut(); showState(null); };
    sb.auth.getSession().then(({ data }) => showState(data.session));
  </script>
</body>
</html>
